<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Mulheres em Risco</title>
<style>
  :root {
    color-scheme: light;
    --cream:#FAF1E1; --cream-deep:#F1E2CA; --surface:#FFFBF3; --line:#E4D2B7; --line-soft:#EFE0C9;
    --petrol-deep:#155E63; --petrol-mid:#3E8A8F; --petrol-wash:#E4F0EF;
    --coral:#AE432B; --good:#387043; --mint:#DCEDE2;
    --ink:#1F2A2B; --ink-soft:#55605F;
    --f-display: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:var(--f-body); line-height:1.6; }
  .wrap { max-width:56rem; margin:0 auto; padding:1.6rem 1.1rem 5rem; }
  h1 { font-family:var(--f-display); font-size:2.1rem; margin:0 0 .3rem; color:var(--petrol-deep); letter-spacing:-.02em; }
  .sub { color:var(--ink-soft); margin:0 0 1.5rem; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:1rem; padding:1.2rem 1.1rem; margin-bottom:1rem; }
  .card h2 { font-family:var(--f-display); font-size:1.1rem; margin:0 0 .9rem; }
  .total { font-family:var(--f-display); font-size:3rem; font-weight:750; color:var(--petrol-deep); line-height:1; }
  .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr)); gap:1rem; }
  .bar-row { margin-bottom:.55rem; }
  .bar-head { display:flex; justify-content:space-between; gap:1rem; font-size:.87rem; margin-bottom:.2rem; }
  .bar-head .n { font-variant-numeric:tabular-nums; color:var(--ink-soft); flex:none; }
  .bar-track { height:.5rem; background:var(--cream-deep); border-radius:99px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--petrol-mid); border-radius:99px; }
  .bar-fill.win { background:var(--good); }
  .quote { border-left:3px solid var(--petrol-mid); padding-left:.8rem; margin:0 0 .7rem; font-size:.92rem; }
  .quote cite { display:block; font-style:normal; font-size:.77rem; color:var(--ink-soft); margin-top:.15rem; }
  .btn { display:inline-block; background:var(--petrol-deep); color:var(--surface); text-decoration:none;
         padding:.7rem 1.2rem; border-radius:.7rem; font-weight:650; font-size:.95rem; border:0; cursor:pointer; font-family:inherit; }
  .vazio { color:var(--ink-soft); font-style:italic; }
  .destaque { background:var(--mint); border-radius:.8rem; padding:.9rem 1rem; margin-bottom:1rem; }
  .destaque strong { color:var(--good); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Painel da pesquisa</h1>
  <p class="sub">Mulheres em Risco · Startup Weekend Women Lages 2026</p>
  <div id="conteudo"><p class="vazio">Carregando…</p></div>
</div>

<script>
const ROTULOS = {
  idade:"Idade", etnia:"Cor ou raça", civil:"Estado civil",
  renda:"Renda da família", religiao:"Religião", cidade:"Cidade"
};
const PERGUNTAS = {
  p1:"O que você entende por violência doméstica?",
  p2:"Conhece alguém que já passou por isso?",
  p3:"Por que uma mulher demora tanto para pedir ajuda?",
  p4:"Quem você indicaria para uma amiga procurar?",
  p5:"Já ouviu falar do Sinal Vermelho?",
  p6:"Se houvesse um botão de emergência, viria ajuda?",
  p7:"Como pedir socorro sem poder pegar o celular?",
  p8:"Falaria uma palavra secreta em voz alta?",
  p10:"E se isso deixasse a pessoa mais brava?",
  p11:"Que palavra você escolheria?",
  p12:"Seu celular fica com você o tempo todo?",
  p13:"Alguém além de você mexe no seu celular?",
  p14:"Alguém sabe a sua senha?",
  p15:"Instalaria um aplicativo dado pela polícia ou prefeitura?",
  p16:"Ouvir o som da sua casa: segurança ou incômodo?",
  p17:"Por quê?",
  p18:"Disfarçado de calculadora muda algo?",
  p19:"Algo que deixamos de perguntar?"
};
// Perguntas de escolha viram barras; as demais viram citações.
const ESCOLHA = ["p2","p5","p6","p8","p10","p12","p13","p14","p15","p16","p18"];

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function barras(titulo, itens, total) {
  if (!itens.length) return "";
  const max = Math.max(...itens.map(i => i.n));
  return `<div class="card"><h2>${esc(titulo)}</h2>` + itens.map(i => {
    const pct = Math.round(i.n / total * 100);
    return `<div class="bar-row"><div class="bar-head"><span>${esc(i.valor)}</span>
      <span class="n">${i.n} · ${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill${i.n === max ? " win" : ""}" style="width:${pct}%"></div></div></div>`;
  }).join("") + "</div>";
}

(async () => {
  const alvo = document.getElementById("conteudo");
  let d;
  try {
    d = await (await fetch("/api/resultados")).json();
  } catch (e) {
    alvo.innerHTML = '<p class="vazio">Não consegui carregar os resultados.</p>';
    return;
  }
  if (!d.total) {
    alvo.innerHTML = '<p class="vazio">Nenhuma resposta ainda.</p>';
    return;
  }

  const respostas = d.respostas.map(l =>
    typeof l.respostas === "string" ? JSON.parse(l.respostas) : l.respostas);

  let html = `<div class="card"><h2>Respostas recebidas</h2>
    <p class="total">${d.total}</p>
    <p style="margin:.8rem 0 0"><a class="btn" href="/api/exportar.csv">Baixar planilha CSV</a></p></div>`;

  // Recorte racial em destaque: 64% das vítimas de feminicídio no Brasil são negras.
  const etnia = d.perfil.etnia || [];
  const negras = etnia.filter(x => x.valor === "Preta" || x.valor === "Parda")
                      .reduce((s, x) => s + x.n, 0);
  const comEtnia = etnia.reduce((s, x) => s + x.n, 0);
  if (comEtnia) {
    html += `<div class="destaque"><strong>${Math.round(negras / comEtnia * 100)}% das respondentes
      se declararam pretas ou pardas.</strong> No Brasil, 64% das vítimas de feminicídio são mulheres negras.</div>`;
  }

  html += '<div class="grade">';
  for (const campo of Object.keys(ROTULOS)) {
    html += barras(ROTULOS[campo], d.perfil[campo] || [], d.total);
  }
  html += "</div>";

  for (const id of ESCOLHA) {
    const cont = {};
    respostas.forEach(r => {
      if (!r[id]) return;
      const chave = String(r[id]).split(" — ")[0];
      cont[chave] = (cont[chave] || 0) + 1;
    });
    const itens = Object.entries(cont).map(([valor, n]) => ({ valor, n })).sort((a, b) => b.n - a.n);
    const soma = itens.reduce((s, i) => s + i.n, 0);
    html += barras(PERGUNTAS[id], itens, soma || 1);
  }

  for (const id of Object.keys(PERGUNTAS)) {
    if (ESCOLHA.includes(id)) continue;
    const textos = respostas.map(r => r[id]).filter(Boolean);
    if (!textos.length) continue;
    html += `<div class="card"><h2>${esc(PERGUNTAS[id])}</h2>` +
      textos.slice(0, 100).map(t => `<blockquote class="quote">${esc(t)}</blockquote>`).join("") +
      (textos.length > 100 ? `<p class="vazio">…e mais ${textos.length - 100}. Baixe o CSV para ver tudo.</p>` : "") +
      "</div>";
  }

  alvo.innerHTML = html;
})();
</script>
</body>
</html>
